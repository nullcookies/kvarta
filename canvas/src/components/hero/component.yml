name: Hero
machineName: hero
status: true
required:
  - heading
  - primaryText
  - primaryLink
  - overlay
  - textColor
props:
  properties:
    eyebrow:
      title: Eyebrow
      type: string
      examples:
        - Обжарка кофе в Минске с 2019 года
    heading:
      title: Heading
      type: string
      examples:
        - Обжариваем в четверг — привозим в пятницу
    text:
      title: Text
      type: string
      contentMediaType: text/html
      x-formatting-context: block
      examples:
        - >-
          <p>Партии по 5 кг, без склада и посредников. Зерно попадает к вам на
          1–3 день после обжарки — поэтому в чашке слышны цветы, карамель и
          шоколад, а не «просто кофе».</p>
    primaryText:
      title: Primary Text
      type: string
      examples:
        - Оформить заявку
    primaryLink:
      title: Primary Link
      type: string
      format: uri-reference
      examples:
        - /#lead
    secondaryText:
      title: Secondary Text
      type: string
      examples:
        - Посмотреть кофе
    secondaryLink:
      title: Secondary Link
      type: string
      format: uri-reference
      examples:
        - /#assortment
    image:
      title: Image
      type: object
      $ref: json-schema-definitions://canvas.module/image
      examples:
        - src: >-
            https://images.unsplash.com/photo-1447933601403-0c6688de566e?auto=format&fit=crop&w=1920&q=80
          alt: Обжарщик за работой у ростера, тёмный кадр
          width: 1920
          height: 1080
    overlay:
      title: Overlay
      type: string
      enum:
        - none
        - light
        - medium
        - strong
      meta:enum:
        none: None
        light: Light
        medium: Medium
        strong: Strong
      examples:
        - medium
    textColor:
      title: Text Color
      type: string
      enum:
        - light
        - dark
      meta:enum:
        light: Light
        dark: Dark
      examples:
        - light
slots:
  facts:
    title: Facts
